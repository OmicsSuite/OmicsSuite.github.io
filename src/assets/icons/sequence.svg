  <!-- Gold glass ribbons form the characteristic sequence double helix. -->
  <path d="M6 3.2c0 3.6 12 4.1 12 8.8s-12 5.2-12 8.8" stroke="currentColor" stroke-opacity=".3" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M18 3.2c0 3.6-12 4.1-12 8.8s12 5.2 12 8.8" stroke="currentColor" stroke-opacity=".24" stroke-width="4.5" stroke-linecap="round"/>
