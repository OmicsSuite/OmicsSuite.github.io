  <path d="M8.16 5.25c.87-1.02 2.3-1.24 3.31-.71m1.12-.6c1.06-.25 2.13.29 2.39 1.22m1.63 2.02c.77.44 1.06 1.33.69 2.08m-1.1 3.14c.29.71.08 1.48-.55 1.9m-2.53 2.26c-.72.63-1.65.62-2.28.12m-3.47-1.14c-.83-.16-1.36-.82-1.3-1.6"
