      <stop offset="1" stop-color="#fff" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="base-pair-one" x1="8" y1="5" x2="16" y2="5" gradientUnits="userSpaceOnUse">
      <stop stop-color="currentColor"/><stop offset=".52" stop-color="#fff"/><stop offset="1" stop-color="currentColor"/>
    </linearGradient>
    <linearGradient id="base-pair-two" x1="7" y1="8" x2="17" y2="8" gradientUnits="userSpaceOnUse">
