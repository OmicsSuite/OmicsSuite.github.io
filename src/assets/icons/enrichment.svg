<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="enrich-orbit" x1="3" y1="4" x2="21" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".48" stop-color="currentColor" stop-opacity=".82"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="enrich-core" x1="8" y1="7" x2="16" y2="17" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".98"/>
      <stop offset=".5" stop-color="currentColor" stop-opacity=".72"/>
      <stop offset="1" stop-color="currentColor" stop-opacity=".94"/>
    </linearGradient>
    <linearGradient id="enrich-glint" x1="8" y1="8" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".98"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".3"/>
    </linearGradient>
  </defs>

  <!-- Connected gene-set bubbles, converging on an enriched pathway -->
  <path d="M5.25 6.2 9.2 9.55m-3.9 4.85 3.9-3.15m5.6-1.6 3.95-3.45m-3.9 8.25 3.9 3.35"
        stroke="currentColor" stroke-opacity=".42" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M5.25 5.55 9.5 9.2m-4.25 5.2L9.5 11m5.15-1.8 4.1-3.25m-4.1 8.55 4.1 3.35"
        stroke="url(#enrich-orbit)" stroke-width=".82" stroke-linecap="round"/>

  <!-- Glass nodes with beveled rims -->
  <circle cx="4.35" cy="4.9" r="2.05" fill="currentColor" fill-opacity=".28" stroke="url(#enrich-orbit)" stroke-width=".82"/>
  <circle cx="4.35" cy="4.45" r=".55" fill="#fff" fill-opacity=".88"/>
  <circle cx="4.35" cy="15.1" r="1.65" fill="currentColor" fill-opacity=".22" stroke="url(#enrich-orbit)" stroke-width=".78"/>
  <circle cx="4.35" cy="14.75" r=".44" fill="#fff" fill-opacity=".82"/>
  <circle cx="19.65" cy="4.9" r="1.7" fill="currentColor" fill-opacity=".24" stroke="url(#enrich-orbit)" stroke-width=".78"/>
  <circle cx="19.65" cy="4.55" r=".42" fill="#fff" fill-opacity=".86"/>
  <circle cx="19.65" cy="18.7" r="2.05" fill="currentColor" fill-opacity=".28" stroke="url(#enrich-orbit)" stroke-width=".82"/>
  <circle cx="19.65" cy="18.25" r=".55" fill="#fff" fill-opacity=".9"/>

  <!-- Highlighted enriched result -->
  <circle cx="12" cy="10.75" r="4.25" fill="currentColor" fill-opacity=".34"/>
  <circle cx="12" cy="10.25" r="4.05" fill="url(#enrich-core)" stroke="#fff" stroke-opacity=".94" stroke-width=".85"/>
  <path d="m12 7.75.73 1.77 1.91.15-1.46 1.22.47 1.86L12 11.72l-1.65 1.03.47-1.86-1.46-1.22 1.91-.15L12 7.75Z"
        fill="url(#enrich-glint)" stroke="#fff" stroke-opacity=".62" stroke-width=".38" stroke-linejoin="round"/>
  <circle cx="10.55" cy="8.9" r=".52" fill="#fff" fill-opacity=".88"/>
