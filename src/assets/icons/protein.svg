  <circle cx="10.25" cy="5.75" r="1.45" fill="currentColor" fill-opacity=".66" stroke="#fff" stroke-opacity=".62" stroke-width=".42"/>
  <circle cx="14.1" cy="6.22" r="1.72" fill="currentColor" fill-opacity=".84" stroke="#fff" stroke-opacity=".72" stroke-width=".5"/>
