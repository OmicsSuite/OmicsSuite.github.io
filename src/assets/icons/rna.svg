<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="rna-enzyme" x1="7" y1="3" x2="18" y2="17" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".98"/>
      <stop offset=".32" stop-color="currentColor" stop-opacity=".88"/>
      <stop offset=".72" stop-color="currentColor" stop-opacity=".62"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="rna-strand" x1="6" y1="8" x2="16" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".98"/>
      <stop offset=".48" stop-color="currentColor" stop-opacity=".98"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="rna-shine" x1="7" y1="4" x2="15" y2="15" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".98"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".18"/>
    </linearGradient>
  </defs>

  <!-- RNA polymerase: a compact glass enzyme with a visible transcription cleft. -->
  <path d="M8.2 3.1c1.5-1.15 3.3-.55 4.2.55 1.65-.72 3.75.05 4.2 1.8 1.65.35 2.8 1.78 2.45 3.38 1.22 1.02 1.42 2.9.35 4.1.1 1.88-1.42 3.28-3.22 3.18l-7.6-.4c-2.5-.13-4.1-1.67-4.03-3.77.05-1.1.6-2.02 1.47-2.62-.65-1.42-.12-3.1 1.25-3.8-.2-.95.13-1.82.93-2.42Z"
        fill="url(#rna-enzyme)" stroke="currentColor" stroke-opacity=".88" stroke-width=".82" stroke-linejoin="round"/>
  <path d="M7.35 6.5c.72-1.05 1.58-1.45 2.55-1.5m5.72.4c1.1.32 1.72 1 1.93 1.92" stroke="url(#rna-shine)" stroke-width=".76" stroke-linecap="round"/>
  <path d="M9.05 8.35c1.35-.72 2.84-.75 4.03-.05 1.08.63 1.75 1.6 2.93 1.86" stroke="#fff" stroke-opacity=".96" stroke-width=".78" stroke-linecap="round"/>

  <!-- The DNA template enters from the left as a short paired strand. -->
  <path d="M.8 8.35c1.95-.25 3.36-.03 5.28.68m-5.28 2.27c2.05.3 3.65-.05 5.6-.78" stroke="url(#rna-strand)" stroke-width="1.18" stroke-linecap="round"/>
  <path d="m2.25 8.3.25 2.5m1.75-1.92.05 1.65m1.28-1.3.03 1.18" stroke="#fff" stroke-opacity=".9" stroke-width=".58" stroke-linecap="round"/>

  <!-- A single newly synthesized RNA transcript exits and curls below the enzyme. -->
  <path d="M13.12 14.82c-.12 1.22-1.05 1.68-2.12 2.23-1.3.67-2.35 1.42-2.28 2.55.08 1.22 1.25 1.8 2.52 1.8h3.18" stroke="currentColor" stroke-opacity=".34" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M13.12 14.82c-.12 1.22-1.05 1.68-2.12 2.23-1.3.67-2.35 1.42-2.28 2.55.08 1.22 1.25 1.8 2.52 1.8h3.18" stroke="url(#rna-strand)" stroke-width="1.48" stroke-linecap="round"/>
  <path d="M12.95 15.18c-.18.9-.93 1.3-1.78 1.76m-1.4 2.62c.12.63.73 1 1.53 1" stroke="#fff" stroke-opacity=".88" stroke-width=".46" stroke-linecap="round"/>
  <circle cx="14.42" cy="21.4" r=".95" fill="currentColor" stroke="#fff" stroke-opacity=".9" stroke-width=".48"/>
</svg>
