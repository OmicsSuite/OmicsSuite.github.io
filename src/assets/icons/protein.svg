  <circle cx="11.02" cy="9.12" r="1.82" fill="currentColor" fill-opacity=".7" stroke="#fff" stroke-opacity=".7" stroke-width=".52"/>
  <circle cx="14.83" cy="12.42" r="1.8" fill="currentColor" fill-opacity=".86" stroke="#fff" stroke-opacity=".58" stroke-width=".5"/>
  <circle cx="10.1" cy="13.15" r="1.62" fill="currentColor" fill-opacity=".76" stroke="#fff" stroke-opacity=".65" stroke-width=".48"/>
  <circle cx="12.65" cy="16.02" r="1.55" fill="currentColor" fill-opacity=".82" stroke="#fff" stroke-opacity=".62" stroke-width=".48"/>
