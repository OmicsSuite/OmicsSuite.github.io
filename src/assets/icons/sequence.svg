  <path d="M7.15 15.2h9.7" stroke="url(#base-pair-four)" stroke-width="1.35" stroke-linecap="round"/>
  <path d="M8.4 18.45h7.2" stroke="url(#base-pair-five)" stroke-width="1.35" stroke-linecap="round"/>
  <path d="M9 4.7h2.4M13 8h2.2M8.3 11.5h2.8M13 15h2.4M9.2 18.2h2.1" stroke="#fff" stroke-opacity=".8" stroke-width=".48" stroke-linecap="round"/>
  <circle cx="6" cy="3.2" r="1.22" fill="url(#sequence-gold)" stroke="#fff" stroke-opacity=".85" stroke-width=".48"/>
