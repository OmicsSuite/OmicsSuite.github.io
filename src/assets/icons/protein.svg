<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="protein-violet" x1="7" y1="3" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset=".2" stop-color="currentColor"/>
      <stop offset=".55" stop-color="currentColor"/>
      <stop offset=".82" stop-color="currentColor"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="protein-aqua" x1="3" y1="13" x2="19" y2="23" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset=".35" stop-color="currentColor" stop-opacity=".48"/>
      <stop offset=".72" stop-color="currentColor" stop-opacity=".72"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="protein-pink" x1="3" y1="5" x2="12" y2="10" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset=".3" stop-color="currentColor"/>
      <stop offset=".7" stop-color="currentColor"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="protein-glint" x1="7" y1="3" x2="18" y2="17" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".08"/>
    </linearGradient>
  </defs>

