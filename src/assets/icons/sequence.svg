  <path d="M18 3.2c0 3.6-12 4.1-12 8.8s12 5.2 12 8.8" stroke="url(#sequence-gold)" stroke-width="3.1" stroke-linecap="round"/>
  <path d="M5.5 4.3c.2 2.9 7.5 3.5 10 5.8M18.5 19.7c-.2-2.9-7.5-3.5-10-5.8" stroke="url(#sequence-shine)" stroke-width=".72" stroke-linecap="round"/>

  <!-- Colored glass base pairs, staggered along the helix. -->
  <path d="M8.4 5.25h7.2M7.15 8.5h9.7M7.1 12h9.8M7.15 15.5h9.7M8.4 18.75h7.2" stroke="currentColor" stroke-opacity=".27" stroke-width="2.15" stroke-linecap="round"/>
