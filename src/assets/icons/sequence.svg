      <stop stop-color="#fff"/>
      <stop offset=".26" stop-color="currentColor"/>
      <stop offset=".52" stop-color="#fff"/>
      <stop offset=".78" stop-color="currentColor"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="sequence-shine" x1="7" y1="3" x2="18" y2="21" gradientUnits="userSpaceOnUse">
