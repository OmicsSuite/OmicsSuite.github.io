  <path d="M2.05 7.25c.73-.28 1.46-.28 2.18 0l.72.3c.67.28 1.35.28 2.03 0l.66-.28c.72-.3 1.45-.3 2.18 0"
        stroke="currentColor" stroke-opacity=".46" stroke-width="3.15" stroke-linecap="round"/>
  <path d="M2.05 6.95c.73-.28 1.46-.28 2.18 0l.72.3c.67.28 1.35.28 2.03 0l.66-.28c.72-.3 1.45-.3 2.18 0"
